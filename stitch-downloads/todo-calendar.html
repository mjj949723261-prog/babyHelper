<!DOCTYPE html><html class="light" lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>计划日程</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {

                        "on-secondary-container": "#6a635c",
                        "on-tertiary-fixed": "#181d19",

                        "surface-tint": "#665c5e",
                        "on-tertiary-fixed-variant": "#434844",
                        "on-error": "#ffffff",
                        "surface-container": "#f2edec",
                        "on-tertiary-container": "#656a65",
                        "on-secondary-fixed-variant": "#4c463f",
                        "surface-dim": "#ded9d8",
                        "surface-variant": "#e6e1e1",
                        "surface-container-highest": "#e6e1e1",
                        "primary-fixed": "#eedfe1",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fef8f8",
                        "on-primary-fixed-variant": "#4e4446",
                        "surface-container-low": "#f8f2f2",
                        "secondary": "#645d56",
                        "on-tertiary": "#ffffff",
                        "surface": "#fef8f8",
                        "secondary-fixed": "#ebe1d7",
                        "inverse-primary": "#d1c3c5",
                        "secondary-container": "#ebe1d7",
                        "on-background": "#1d1b1b",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f5efef",
                        "surface-container-high": "#ece7e6",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#e6ebe5",
                        "primary-container": "#f5e6e8",
                        "error": "#ba1a1a",
                        "primary": "#665c5e",
                        "on-surface-variant": "#4d4546",
                        "tertiary-fixed-dim": "#c3c8c2",
                        "tertiary": "#5a605b",
                        "outline-variant": "#d0c3c5",
                        "on-secondary-fixed": "#1f1b15",
                        "inverse-surface": "#323030",
                        "secondary-fixed-dim": "#cec5bc",
                        "primary-fixed-dim": "#d1c3c5",
                        "outline": "#7f7576",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "tap-target-min": "48px",
                        "element-gap": "12px",
                        "page-margin": "24px",
                        "section-gap": "32px",
                        "card-padding": "20px",
                        "safe-top": "env(safe-area-inset-top)",
                        "safe-bottom": "env(safe-area-inset-bottom)"
                    },
                    fontFamily: {
                        "label-md": ["Plus Jakarta Sans", "sans-serif"],
                        "body-md": ["Plus Jakarta Sans", "sans-serif"],
                        "label-sm": ["Plus Jakarta Sans", "sans-serif"],
                        "headline-md": ["Plus Jakarta Sans", "sans-serif"],
                        "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body-lg": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    fontSize: {
                        "label-md": ["13px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "500" }],
                        "body-md": ["15px", { lineHeight: "24px", fontWeight: "400" }],
                        "label-sm": ["11px", { lineHeight: "16px", letterSpacing: "0.03em", fontWeight: "600" }],
                        "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-lg": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "display": ["30px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-lg": ["17px", { lineHeight: "26px", fontWeight: "400" }]
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-[calc(env(safe-area-inset-bottom)+100px)] font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Custom for Detail Page) -->
<header class="sticky top-0 z-50 bg-background/90 backdrop-blur-md pt-safe-top h-[calc(env(safe-area-inset-top)+56px)] flex items-center px-page-margin justify-between">
<button class="w-tap-target-min h-tap-target-min flex items-center justify-start -ml-2 text-primary active:opacity-50 transition-opacity">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 font-headline-md text-headline-md text-primary tracking-tight">计划日程</h1>
<!-- WeChat Capsule Safe Area Placeholder (~95px width) -->
<div class="w-[95px] h-8"></div>
</header>
<main class="px-page-margin pt-2 flex flex-col gap-section-gap">
<!-- Calendar Section -->
<section class="flex flex-col gap-element-gap">
<div class="flex items-center justify-between px-2">
<div class="font-body-lg text-body-lg text-on-surface font-medium flex items-center gap-1">
<span class="">2023兴10月</span>
<span class="material-symbols-outlined text-[18px] text-outline">expand_more</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-primary bg-surface-container rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">calendar_month</span>
</button>
</div>
<div class="flex justify-between items-center bg-surface-container-lowest rounded-xl p-4 shadow-soft">
<!-- Days (Sun to Sat) -->
<div class="flex flex-col items-center gap-2 cursor-pointer active:opacity-70">
<span class="font-label-sm text-label-sm text-outline-variant">日</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant font-body-md text-body-md">15</div>
</div>
<div class="flex flex-col items-center gap-2 cursor-pointer active:opacity-70">
<span class="font-label-sm text-label-sm text-outline-variant">一</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant font-body-md text-body-md">16</div>
</div>
<div class="flex flex-col items-center gap-2 cursor-pointer active:opacity-70">
<span class="font-label-sm text-label-sm text-outline-variant">二</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant font-body-md text-body-md">17</div>
</div>
<!-- Active Day -->
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-primary">三</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full bg-primary-container text-on-primary-container font-body-md text-body-md font-semibold ring-4 ring-primary-container/30">18</div>
</div>
<div class="flex flex-col items-center gap-2 cursor-pointer active:opacity-70">
<span class="font-label-sm text-label-sm text-outline-variant">四</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant font-body-md text-body-md">19</div>
</div>
<div class="flex flex-col items-center gap-2 cursor-pointer active:opacity-70">
<span class="font-label-sm text-label-sm text-outline-variant">五</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant font-body-md text-body-md">20</div>
</div>
<div class="flex flex-col items-center gap-2 cursor-pointer active:opacity-70">
<span class="font-label-sm text-label-sm text-outline-variant">六</span>
<div class="w-9 h-9 flex items-center justify-center rounded-full text-on-surface-variant font-body-md text-body-md">21</div>
</div>
</div>
</section>
<!-- Todo List Section -->
<section class="flex flex-col gap-4"><div class="flex gap-element-gap mb-2 overflow-x-auto pb-1 no-scrollbar">
<button class="px-4 py-1.5 rounded-full bg-primary text-on-primary font-label-md shadow-sm whitespace-nowrap">全部</button>
<button class="px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md active:bg-primary-container transition-colors whitespace-nowrap">特殊&nbsp;</button>
<button class="px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md active:bg-primary-container transition-colors whitespace-nowrap">日常</button>
</div>
<!-- Important Tasks First -->
<div class="bg-primary-container/20 border border-primary-container/50 rounded-lg p-card-padding shadow-soft flex items-start gap-4 active:bg-primary-container/30 transition-colors relative overflow-hidden">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-12 bg-primary rounded-r-full"></div>
<button class="mt-1 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center flex-shrink-0 transition-colors"></button>
<div class="flex-1 flex flex-col gap-1 ml-1">
<div class="flex items-center gap-2 mb-0.5">
<span class="px-2 py-0.5 bg-primary-container text-primary text-[10px] font-semibold rounded-full flex items-center gap-0.5 shadow-sm ring-1 ring-primary/10">
<span class="material-symbols-outlined text-[12px] icon-fill">star</span>特殊</span>
</div>
<div class="flex items-baseline gap-3">
<span class="font-body-md text-body-md font-semibold text-on-surface">10:30</span>
<span class="font-body-lg text-body-lg text-on-surface">小憩</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">预计 45 分钟，保持室内昏暗</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline active:text-primary transition-colors -mr-2">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<!-- Daily Tasks Second -->
<div class="bg-surface-container-lowest rounded-lg p-card-padding shadow-soft flex items-start gap-4 active:bg-surface-container/50 transition-colors relative overflow-hidden">
<button class="mt-1 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center flex-shrink-0 transition-colors"></button>
<div class="flex-1 flex flex-col gap-1">
<div class="flex items-center gap-2 mb-0.5">
<span class="px-2 py-0.5 bg-tertiary-container text-on-tertiary-container text-[10px] font-semibold rounded-full uppercase tracking-wider">日常</span>
</div>
<div class="flex items-baseline gap-3">
<span class="font-body-md text-body-md font-semibold text-on-surface">08:00</span>
<span class="font-body-lg text-body-lg text-on-surface">喂奶</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">配方奶 120ml，注意拍嗝</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline active:text-primary transition-colors -mr-2">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<!-- Completed Task -->
<div class="bg-surface-container-lowest/60 rounded-lg p-card-padding flex items-start gap-4 opacity-70">
<button class="mt-1 w-6 h-6 rounded-full border-2 border-primary bg-primary flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-primary text-[16px] icon-fill">check</span>
</button>
<div class="flex-1 flex flex-col gap-1">
<div class="flex items-baseline gap-3">
<span class="font-body-md text-body-md text-outline line-through decoration-1">06:30</span>
<span class="font-body-lg text-body-lg text-outline line-through decoration-1">换尿不湿</span>
</div>
<span class="font-label-md text-label-md text-outline-variant">早晨第一次清理</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline-variant -mr-2">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div></section>
<!-- Empty State (Optional, commented out for this view) -->

        <div class="flex flex-col items-center justify-center py-12 gap-4 text-outline">
            <span class="material-symbols-outlined text-4xl font-light">cruelty_free</span>
            <p class="font-label-md text-label-md">今日暂无安排，放松一下吧</p>
        </div> 
        -->
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-8 right-page-margin w-14 h-14 bg-primary-container text-on-primary-container rounded-full shadow-[0_8px_24px_rgba(102,92,94,0.15)] flex items-center justify-center active:scale-90 transition-transform duration-300 z-40 group">
<span class="material-symbols-outlined text-[28px] group-active:rotate-90 transition-transform duration-300">add</span>
</button>


</body></html>
