<script>
        // Simple interactions for demonstration
        function closeSheet() {
            const sheet = document.querySelector('.sheet-container');
            const backdrop = document.querySelector('.backdrop');
            
            sheet.style.animation = 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
            backdrop.style.animation = 'fadeIn 0.2s ease-out reverse forwards';
            
            setTimeout(() => {
                // In a real app, this would remove the DOM elements or hide them
                console.log("Sheet closed");
            }, 300);
        }

        function confirmDate() {
            // Add a little visual feedback before closing
            const btn = document.querySelector('.bg-primary-container');
            btn.classList.add('scale-95');
            setTimeout(() => {
                btn.classList.remove('scale-95');
                closeSheet();
            }, 150);
        }
